<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: #ffffff; margin: 0 auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { background-color: #0d6efd; color: #ffffff; padding: 24px; text-align: center; }
        .header h2 { margin: 0; font-size: 22px; font-weight: 600; }
        .content { padding: 28px; color: #333333; }
        .section-title { font-size: 12px; text-transform: uppercase; color: #6c757d; border-bottom: 2px solid #e9ecef; padding-bottom: 6px; margin-top: 20px; margin-bottom: 14px; font-weight: bold; letter-spacing: 0.5px; }
        .data-row { margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
        .data-label { font-weight: bold; color: #495057; display: inline-block; width: 140px; }
        .data-value { color: #212529; }
        .data-value a { color: #0d6efd; text-decoration: none; }
        .box { background: #f8f9fa; border-left: 4px solid #0d6efd; padding: 14px; margin-top: 10px; font-size: 14px; color: #495057; border-radius: 0 4px 4px 0; }
        .footer { background: #e9ecef; text-align: center; padding: 14px; font-size: 12px; color: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>$heading</h2>
        </div>
        <div class="content">
            <!-- Sections and rows are generated in app.py (send_email_notification) -->
            $sections
        </div>
        <div class="footer">
            Automated lead alert generated by Dalbagni Health Client Intake Platform.
        </div>
    </div>
</body>
</html>
